<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E1032"/>
      <stop offset="0.55" stop-color="#131132"/>
      <stop offset="1" stop-color="#151232"/>
    </linearGradient>
  </defs>
  <!-- Card bg -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#bg)"/>
  <!-- Simple ticket icon - clean for 32x32 -->
  <g transform="translate(4, 5)">
    <!-- Ticket body -->
    <rect x="0" y="0" width="24" height="22" rx="3" fill="#909090"/>
    <!-- Left notch cutout -->
    <rect x="-2" y="7" width="4" height="8" rx="2" fill="url(#bg)"/>
    <!-- Right notch cutout -->
    <rect x="22" y="7" width="4" height="8" rx="2" fill="url(#bg)"/>
    <!-- Perforation line -->
    <rect x="16" y="0" width="1" height="22" fill="#FFFFFF" fill-opacity="0.25" rx="0.5"/>
    <!-- Accent line top -->
    <rect x="4" y="3" width="8" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.5"/>
    <!-- Accent line bottom -->
    <rect x="4" y="7" width="6" height="1.5" rx="0.75" fill="#FFFFFF" fill-opacity="0.3"/>
    <!-- Barcode vertical lines -->
    <rect x="4" y="12" width="1.5" height="7" rx="0.5" fill="#FFFFFF" fill-opacity="0.35"/>
    <rect x="6.5" y="12" width="1" height="7" rx="0.5" fill="#FFFFFF" fill-opacity="0.25"/>
    <rect x="8.5" y="12" width="1.5" height="7" rx="0.5" fill="#FFFFFF" fill-opacity="0.35"/>
    <rect x="11" y="12" width="1" height="7" rx="0.5" fill="#FFFFFF" fill-opacity="0.25"/>
  </g>
  <!-- Highlight stroke -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
