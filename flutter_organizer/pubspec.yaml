name: ticketpulse_organizer
description: TicketPulse organizer operations for Android and iOS.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^10.0.0
  mobile_scanner: ^7.4.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
