name: ticketpulse
description: TicketPulse events, ticket purchases, and organizer operations.
publish_to: none
version: 1.0.0+2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^10.0.0
  app_links: ^7.2.1
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  wakelock_plus: ^1.8.0
  share_plus: ^13.3.0
  cached_network_image: ^4.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
